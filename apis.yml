apis:
- name: Refuel Cloud API
  description: >-
    Programmatic access to the Refuel Cloud platform for managing projects,
    datasets, labeling tasks, task runs, finetuned models, and deployed
    applications. Accessed through the first-party Python (refuel) and
    JavaScript (refuel-sdk) SDKs; authenticated with an API key supplied via the
    REFUEL_API_KEY environment variable or an api_key initialization option.
