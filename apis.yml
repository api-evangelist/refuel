aid: refuel
name: Refuel
description: >-
  Refuel is a data labeling and enrichment platform that uses large language
  models to label, clean, structure, and enrich text datasets at scale. Its
  Refuel Cloud service lets teams define labeling tasks, connect datasets from
  cloud storage and data warehouses (Amazon S3, Google Cloud Storage, Snowflake,
  Databricks), finetune models, chain tasks, evaluate LLM outputs, and deploy
  applications that transform new data in realtime or in batch. Refuel also
  publishes the open-source autolabel Python library and first-party Python and
  JavaScript SDKs for programmatic access, authenticated with API keys. Refuel
  is joining Together AI.
